# ==============================================================================
# Render Infrastructure as Code (Blueprint) Specification
# MediCare Hospital Portal System - Full-Stack Production Deployment
# ==============================================================================

databases:
  - name: medicare-postgres
    databaseName: medicare_db
    user: medicare_user
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Dockerized)
  # ----------------------------------------------------------------------------
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /api/departments
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://medicare-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: medicare-frontend
    rootDir: frontend
    region: oregon
    branch: main
    buildCommand: npm install && (chmod +x node_modules/.bin/* 2>/dev/null || true) && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medicare-backend
          property: host
