# ==========================================================
# MediCare Hospital Portal System - MSSQL Server Profile
# ==========================================================

# Microsoft SQL Server connection on default port 1433
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=medicare_db;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrong@Passw0rd

# Hibernate validates schema against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
