# ==========================================================
# MediCare Hospital Portal System - Dev Profile (H2 In-Memory)
# ==========================================================

# In-Memory H2 Database running in MSSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:medicare_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate auto-creates & updates schema for rapid local dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway is disabled in dev profile to avoid MSSQL-specific DDL differences in H2
spring.flyway.enabled=false
