# ==========================================================
# MediCare Hospital Portal System - Backend Configuration
# ==========================================================
spring.application.name=medicare-hospital-backend
server.port=${PORT:8080}

# Active Profile:
# 'dev'      -> Zero-configuration in-memory H2 database (instant local start)
# 'postgres' -> PostgreSQL database for production cloud deployment on Render
# 'mssql'    -> Connects to Microsoft SQL Server on localhost:1433 with Flyway migrations
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ----------------------------------------------------------
# Security & JWT Configuration
# ----------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# ----------------------------------------------------------
# Logging
# ----------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.yourorg.appname=DEBUG

